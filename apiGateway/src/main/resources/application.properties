spring.application.name=apiGateway

server.port=8084

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.server.webflux.routes[0].id=inventory
spring.cloud.gateway.server.webflux.routes[0].uri=lb://inventory
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/inventories/**

spring.cloud.gateway.server.webflux.routes[1].id=products
spring.cloud.gateway.server.webflux.routes[1].uri=lb://products
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/products/**

spring.cloud.gateway.server.webflux.routes[2].id=order
spring.cloud.gateway.server.webflux.routes[2].uri=lb://order
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/orders/**
