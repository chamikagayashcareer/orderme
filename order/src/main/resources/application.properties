spring.application.name=order
server.port=0

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/order?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=rootuser
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Kafka properties

# Kafka Bootstrap Server
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.template.default-topic=order-events

# Serializers
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Essential JSON JsonSerializer settings
spring.kafka.producer.properties.spring.json.add.type.headers=true
spring.kafka.producer.properties.spring.json.trusted.packages=*

eureka.client.service-url.defaultZone=http://localhost:8761/eureka